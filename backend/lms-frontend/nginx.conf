server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve assets first
    location ^~ /assets/ {
        try_files $uri =404;  # Serve the file or 404, no fallback
    }

    # Everything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
