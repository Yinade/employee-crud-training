lms.aws.sns.reportingPaymentReferenceDataEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentReferenceDataEvents-Local
lms.aws.sns.reportingPaymentTportSettlementEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentTportSettlementEvents-Local
