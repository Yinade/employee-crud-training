spring.application.name=lms-payment-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/test_unit?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
#forproduction enc
spring.datasource.password=
#forlocal development
#spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# public URL prefix for static files
file.upload.public-prefix=/uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB


# Swagger / SpringDoc settings
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.layout=BaseLayout
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.show-extensions=true


# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
spring.jackson.serialization.write-dates-as-timestamps=false
app.upload.root=${user.dir}/uploads


# JWT Settings
jwt.secretKey=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt-expiration-milliseconds=604800000

# ---------- AWS / SNS & SQS (LOCAL) for payment-service ----------

# Shared region
lms.aws.region=us-east-1

# =========================================================
# Existing queues that PAYMENT-SERVICE consumes
# =========================================================
lms.aws.sqs.identityAccountQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-AccountEvents-Local
lms.aws.sqs.paymentClientQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-ClientEvents-Local
lms.aws.sqs.paymentDestinationQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-DestinationEvents-Local
lms.aws.sqs.paymentOperationQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-OperationEvents-Local
lms.aws.sqs.paymentPortQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-PortEvents-Local
lms.aws.sqs.paymentExternalAgentQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-ExternalAgentEvents-Local
lms.aws.sqs.paymentBulkPackagingQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-BulkPackagingEvents-Local
lms.aws.sqs.paymentContainerTypesQueueUrl=https://sqs.us-east-1.amazonaws.com/597088023707/SQS-Subscription-payment-service-ContainerTypeEvents-Local

# Poll delays for existing consumers
lms.aws.sqs.identityAccount.pollDelay-ms=2000
lms.aws.sqs.operationBulkPackaging.pollDelay-ms=2000
lms.aws.sqs.operationContainerTypes.pollDelay-ms=2000

# =========================================================
# Existing SNS topic: PAYMENT-SERVICE publishes to OPERATION-SERVICE
# =========================================================
lms.aws.sns.quotationTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-QuotationEvents-Local

# =========================================================
# New SNS topics: PAYMENT-SERVICE publishes to REPORTING-SERVICE
# =========================================================
lms.aws.sns.reportingPaymentAccountEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentAccountEvents-Local
lms.aws.sns.reportingPaymentClientEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentClientEvents-Local
lms.aws.sns.reportingPaymentOperationEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentOperationEvents-Local
lms.aws.sns.reportingPaymentQuotationEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentQuotationEvents-Local
lms.aws.sns.reportingPaymentQuotationItemEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentQuotationItemEvents-Local
lms.aws.sns.reportingPaymentInvoiceEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentInvoiceEvents-Local
lms.aws.sns.reportingPaymentInvoiceItemEventsTopicArn=arn:aws:sns:us-east-1:597088023707:SNS-Publish-payment-service-reporting-service-PaymentInvoiceItemEvents-Local
