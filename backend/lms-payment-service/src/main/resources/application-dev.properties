spring.application.name=lms-payment-service
# choose a port that doesn't clash with identity (8080). You used 8087 ? let's keep it.
server.port=8087

# ---------- Database (RDS) ----------
spring.datasource.url=jdbc:mysql://lms-identity-mysql.cir0406cepmk.us-east-1.rds.amazonaws.com:3306/impact_lms_payment_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=payment_user
spring.datasource.password=impact#lms
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# MySQL8Dialect is deprecated; either omit or use the generic MySQLDialect:
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway (you currently keep it off)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File uploads (mount a volume in Docker to persist)
file.upload.public-prefix=/uploads
app.upload.root=/data/uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Swagger / SpringDoc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.layout=BaseLayout
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.show-extensions=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.lms.payment_service=DEBUG

# JWT
jwt.secretKey=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt-expiration-milliseconds=604800000