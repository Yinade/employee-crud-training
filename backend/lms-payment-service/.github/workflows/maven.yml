name: Build and Push lms-payment-service to ECR

on:
  push:
    branches:
      - main          # Production pipeline
      - development   # Development pipeline

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 for Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Configure Maven for GitHub Packages
      - name: Configure Maven for GitHub Packages
        run: |
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github-lms-common</id>
                <username>Yinade</username>
                <password>${{ secrets.PAT }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Step 4: Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests  # Builds target/payment-service.jar

      # Step 5: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 6: Login to Amazon ECR
      - name: Log in to Amazon ECR
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # Step 7: Set Environment Variables based on Branch
      - name: Set Environment Variables
        id: set-env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=prod-latest" >> $GITHUB_ENV
            echo "ECR_REPOSITORY=lms-payment-service" >> $GITHUB_ENV
          else
            echo "TAG=dev-latest" >> $GITHUB_ENV
            echo "ECR_REPOSITORY=lms-payment-service" >> $GITHUB_ENV
          fi

      # Step 8: Build and Push Docker Image to ECR
      - name: Build and Push Docker Image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          IMAGE_TAG=${{ env.TAG }}
          docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG