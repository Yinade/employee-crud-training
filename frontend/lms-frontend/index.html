<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Metronic React Demo 1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- <script src="https://cdn.jsdelivr.net/npm/react@19.1.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@19.1.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script> -->

    <title>Logistics Management System</title>

    <!-- ✅ Root-relative favicon -->
    <link rel="shortcut icon" href="/media/logos/Impact-Icon.png" />
  </head>

  <body id="kt_body" class="page-loading">
    <noscript>
      <div
        style="
          color: red;
          font-weight: bold;
          font-size: 36px;
          text-align: center;
          margin-top: 20px;
        "
      >
        Please open the app in a JavaScript-enabled browser.
      </div>
    </noscript>
    <!--begin::Theme mode setup on page load-->
    <script>
      let themeMode = "system";

      if (localStorage.getItem("kt_theme_mode_value")) {
        themeMode = localStorage.getItem("kt_theme_mode_value");
      }

      if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.setAttribute("data-bs-theme", themeMode);
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="root"></div>
    <div id="root-modals"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--begin::Loading markup-->
    <div
      id="splash-screen"
      class="splash-screen"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      "
    >
      <!-- ✅ Root-relative logo -->
      <img
        src="/media/logos/Logo-Color-Update.jpg"
        alt="Logo"
        style="max-width: 400px; width: 80%; height: auto; margin-bottom: 20px"
      />
    </div>
    <!--end::Loading markup-->
  </body>
</html>
